services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibvap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibvap"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ibvap
      AI_API_KEY: ${AI_API_KEY:-change-this-secret}
      DEBUG: ${DEBUG:-false}
      MEDIA_ROOT: /app/media
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media

volumes:
  postgres_data:
